name: todo_app
description: A modern Todo application with Flutter and Node.js

publish_to: 'none' # Remove this line if you want to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State Management
  provider: ^6.1.1
  # HTTP Client
  dio: ^5.4.0
  # Local Storage
  shared_preferences: ^2.2.2
  # Form Validation
  form_validator: ^2.1.1
  # Date and Time Picker
  intl: ^0.19.0
  # UI Components
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  # Navigation
  go_router: ^13.0.1
  # Animations
  flutter_animate: ^4.2.0
  # Utilities
  uuid: ^4.3.3
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.1

# Correct launcher icons config
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/mesob_to_do.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/mesob_to_do.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
